<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퍼스널 웨딩밴드 테스트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #fdf5f7; color: #2c2c2c; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 480px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 30px rgba(224, 140, 163, 0.12); padding: 28px 20px; position: relative; overflow: hidden; border: 1px solid #f7e2e7; }
    
    /* Start Screen */
    .screen { display: none; flex-direction: column; align-items: center; text-align: center; }
    .screen.active { display: flex; }
    .badge { background: #fce8ed; color: #d66585; font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 50px; margin-bottom: 16px; letter-spacing: -0.2px; }
    .title { font-size: 24px; font-weight: 700; color: #2b1f24; margin-bottom: 10px; line-height: 1.35; word-break: keep-all; }
    .subtitle { font-size: 14px; color: #78636a; margin-bottom: 28px; line-height: 1.5; word-break: keep-all; }
    .ring-icon-start { width: 100px; height: 100px; border-radius: 50%; background: #fff5f7; border: 2px dashed #f0b6c6; display: flex; align-items: center; justify-content: center; font-size: 42px; margin-bottom: 30px; }
    
    /* Button */
    .btn { width: 100%; background: #d66585; color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(214, 101, 133, 0.25); outline: none; -webkit-appearance: none; }
    .btn:hover { background: #c25272; transform: translateY(-1px); }
    .btn:active { background: #b04362; transform: scale(0.98); }
    
    /* Quiz Screen */
    .progress-bar-container { width: 100%; background: #fce8ed; height: 8px; border-radius: 4px; margin-bottom: 24px; overflow: hidden; }
    .progress-bar { width: 0%; height: 100%; background: #d66585; border-radius: 4px; transition: width 0.3s ease; }
    .q-count { font-size: 13px; font-weight: 600; color: #d66585; margin-bottom: 8px; align-self: flex-start; }
    .question-text { font-size: 18px; font-weight: 700; color: #2b1f24; margin-bottom: 24px; text-align: left; width: 100%; line-height: 1.45; word-break: keep-all; min-height: 52px; }
    .options { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    
    /* 모바일 잔상 방지를 위한 옵션 버튼 스타일 (active 시 확실한 피드백 후 즉시 원복) */
    .option-btn { width: 100%; background: #fffafd; border: 1.5px solid #f5dce3; padding: 18px 16px; border-radius: 14px; font-size: 15px; font-weight: 500; color: #3b2d32; text-align: left; cursor: pointer; transition: background 0.1s ease, border-color 0.1s ease, transform 0.1s ease; line-height: 1.45; word-break: keep-all; outline: none; -webkit-appearance: none; }
    .option-btn:hover { background: #fcebf0; border-color: #d66585; color: #2b1f24; }
    .option-btn:active, .option-btn.touch-active { background: #f2c7d3 !important; border-color: #b04362 !important; color: #2b1f24 !important; transform: scale(0.98); }
    
    /* Result Screen */
    .result-tag { font-size: 13px; color: #d66585; font-weight: 600; margin-bottom: 6px; }
    .result-title { font-size: 26px; font-weight: 700; color: #2b1f24; margin-bottom: 8px; word-break: keep-all; }
    .result-hashtags { font-size: 14px; font-weight: 600; color: #c25a78; margin-bottom: 20px; word-break: keep-all; }
    
    /* Round Image Frame */
    .image-frame-wrapper { margin-bottom: 20px; position: relative; }
    .circle-frame-link { display: block; text-decoration: none; border-radius: 50%; }
    .circle-frame { width: 160px; height: 160px; border-radius: 50%; border: 3px solid #f0b6c6; background: #fff5f7; display: flex; justify-content: center; align-items: center; overflow: hidden; box-shadow: 0 6px 16px rgba(214, 101, 133, 0.12); transition: transform 0.2s ease; margin: 0 auto; }
    .circle-frame-link:hover .circle-frame { transform: scale(1.03); border-color: #d66585; }
    .circle-frame img { width: 100%; height: 100%; object-fit: cover; }
    .placeholder-text { font-size: 12px; color: #b58d99; text-align: center; padding: 10px; line-height: 1.3; }
    
    .desc-box { background: #fff7f9; border: 1px solid #f7e0e7; border-radius: 14px; padding: 18px; margin-bottom: 24px; width: 100%; text-align: left; }
    .desc-box-title { font-size: 13px; font-weight: 700; color: #d66585; margin-bottom: 8px; }
    .desc-box-text { font-size: 14px; color: #4a3a40; line-height: 1.6; word-break: keep-all; }

    /* Counselor View Button & Modal */
    .counselor-btn { background: transparent; border: none; color: #b58d99; font-size: 12px; font-weight: 500; margin-top: 14px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; outline: none; }
    .counselor-btn:hover { color: #d66585; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #fff; width: 100%; max-width: 440px; max-height: 80vh; border-radius: 16px; padding: 20px; overflow-y: auto; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid #f7e2e7; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #fce8ed; padding-bottom: 10px; }
    .modal-title { font-size: 16px; font-weight: 700; color: #2b1f24; }
    .modal-close { background: none; border: none; font-size: 18px; color: #888; cursor: pointer; }
    
    .copy-btn { width: 100%; background: #fce8ed; color: #d66585; border: 1px solid #f0b6c6; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 14px; transition: all 0.2s; outline: none; }
    .copy-btn:hover { background: #d66585; color: #fff; }

    .answers-list { display: flex; flex-direction: column; gap: 10px; }
    .answer-item { background: #fff7f9; border: 1px solid #f7e0e7; border-radius: 10px; padding: 12px; }
    .answer-q { font-size: 13px; font-weight: 700; color: #d66585; margin-bottom: 4px; }
    .answer-a { font-size: 13px; color: #3b2d32; font-weight: 600; line-height: 1.4; }
  </style>
</head>
<body>

<div class="container">
  <!-- START SCREEN -->
  <div id="start-screen" class="screen active">
    <div class="badge">WEDDING BAND TEST</div>
    <div class="title">퍼스널 웨딩밴드<br>취향 테스트</div>
    <div class="subtitle">우리 둘에게 딱 맞는 반지 알아보기🧞‍♂️</div>
    <div class="ring-icon-start">💍</div>
    <button class="btn" onclick="startQuiz()">테스트 시작하기</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen" class="screen">
    <div class="progress-bar-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <div id="q-count" class="q-count">Q1 / 12</div>
    <div id="question-text" class="question-text">질문 텍스트</div>
    <div class="options">
      <button class="option-btn" id="opt-a" onclick="handleSelect('A')">선택지 A</button>
      <button class="option-btn" id="opt-b" onclick="handleSelect('B')">선택지 B</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result-screen" class="screen">
    <div class="result-tag">나만의 퍼스널 웨딩밴드 결과</div>
    <div id="result-mbti" style="font-size: 12px; color: #aaa; margin-bottom: 4px;">ESTJ</div>
    <div id="result-title" class="result-title">정갈한 클래식주의자</div>
    <div id="result-hashtags" class="result-hashtags">#유행&lt;&lt;&lt;변함없는가치</div>
    
    <!-- 원형 이미지 프레임 영역 (클릭시 상세페이지 이동) -->
    <div class="image-frame-wrapper">
      <a id="result-link" class="circle-frame-link" href="#" target="_blank">
        <div class="circle-frame" id="circle-frame">
          <span class="placeholder-text" id="placeholder-text">반지 이미지<br>프레임</span>
        </div>
      </a>
    </div>

    <div class="desc-box">
      <div class="desc-box-title">캐릭터 설명 및 특징</div>
      <div id="result-desc" class="desc-box-text">설명 텍스트가 들어갑니다.</div>
    </div>

    <button class="btn" onclick="resetQuiz()">다시 테스트하기</button>

    <!-- 상담자용 선택 답변 확인 버튼 -->
    <button class="counselor-btn" onclick="toggleCounselorModal()">📋 상담자용 선택 답변 보기</button>
  </div>
</div>

<!-- 상담자 전용 선택 답변 모달 팝업 -->
<div id="counselor-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title">상담용 고객 답변 리스트</span>
      <button class="modal-close" onclick="toggleCounselorModal()">✕</button>
    </div>
    
    <!-- 클립보드 복사 버튼 -->
    <button id="copy-btn" class="copy-btn" onclick="copyCounselorAnswers()">📋 전체 답변 복사하기</button>

    <div id="answers-summary-list" class="answers-list">
      <!-- 자바스크립트로 선택 답변 리스트가 생성됩니다 -->
    </div>
  </div>
</div>

  let currentIdx = 0;
  let scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  let userAnswers = [];

  function startQuiz() {
    currentIdx = 0;
    scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
    userAnswers = [];
    showScreen('quiz-screen');
    renderQuestion();
  }

  function renderQuestion() {
    const qData = questions[currentIdx];
    document.getElementById('q-count').innerText = `Q${currentIdx + 1} / ${questions.length}`;
    document.getElementById('question-text').innerText = qData.q;
    
    const btnA = document.getElementById('opt-a');
    const btnB = document.getElementById('opt-b');
    
    btnA.innerText = qData.optA.text;
    btnB.innerText = qData.optB.text;
    
    // 모바일 포커스 및 잔상 완전 초기화
    btnA.blur();
    btnB.blur();
    btnA.classList.remove('touch-active');
    btnB.classList.remove('touch-active');
    
    const progressPercent = ((currentIdx) / questions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progressPercent}%`;
  }

  function handleSelect(choice) {
    const btnA = document.getElementById('opt-a');
    const btnB = document.getElementById('opt-b');
    const clickedBtn = choice === 'A' ? btnA : btnB;

    // 터치/클릭 순간 명확한 애니메이션 효과 적용
    clickedBtn.classList.add('touch-active');

    // 0.15초 동안 터치 피드백을 보여준 뒤 다음 문항으로 부드럽게 전환
    setTimeout(() => {
      const qData = questions[currentIdx];
      const selected = choice === 'A' ? qData.optA : qData.optB;
      scores[selected.type]++;

      userAnswers.push({
        qNum: currentIdx + 1,
        qText: qData.q,
        choice: choice,
        text: selected.text,
        type: selected.type
      });

      currentIdx++;
      if (currentIdx < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }, 150);
  }

  function showResult() {
    const mbti = 
      (scores.E >= scores.I ? 'E' : 'I') +
      (scores.S >= scores.N ? 'S' : 'N') +
      (scores.T >= scores.F ? 'T' : 'F') +
      (scores.J >= scores.P ? 'J' : 'P');

    const resultData = results[mbti] || results['ISTJ'];

    document.getElementById('result-mbti').innerText = mbti;
    document.getElementById('result-title').innerText = resultData.title;
    document.getElementById('result-hashtags').innerText = resultData.hashtags;
    document.getElementById('result-desc').innerText = resultData.desc;

    const linkElem = document.getElementById('result-link');
    if (resultData.detailUrl && resultData.detailUrl.trim() !== '') {
      linkElem.href = resultData.detailUrl;
      linkElem.style.pointerEvents = 'auto';
    } else {
      linkElem.href = '#';
      linkElem.style.pointerEvents = 'none';
    }

    const circleFrame = document.getElementById('circle-frame');
    if (resultData.imageUrl && resultData.imageUrl.trim() !== '') {
      circleFrame.innerHTML = `<img src="${resultData.imageUrl}" alt="${resultData.title}" onerror="this.onerror=null; this.parentNode.innerHTML='<span style=\\'font-size:42px;\\'>💍</span>';">`;
    } else {
      circleFrame.innerHTML = `<span class="placeholder-text" id="placeholder-text">반지 이미지<br>프레임</span>`;
    }

    renderCounselorAnswers();
    showScreen('result-screen');
  }

  function renderCounselorAnswers() {
    const container = document.getElementById('answers-summary-list');
    container.innerHTML = '';

    userAnswers.forEach(ans => {
      const item = document.createElement('div');
      item.className = 'answer-item';
      item.innerHTML = `
        <div class="answer-q">Q${ans.qNum}. ${ans.qText}</div>
        <div class="answer-a">[선택 ${ans.choice} / ${ans.type}] ${ans.text}</div>
      `;
      container.appendChild(item);
    });
  }

  function copyCounselorAnswers() {
    let textToCopy = `[퍼스널 웨딩밴드 테스트 - 고객 선택 답변]\n`;
    textToCopy += `최종 유형: ${document.getElementById('result-mbti').innerText} (${document.getElementById('result-title').innerText})\n\n`;
    
    userAnswers.forEach(ans => {
      textToCopy += `Q${ans.qNum}. ${ans.qText}\n👉 [선택 ${ans.choice} / ${ans.type}] ${ans.text}\n\n`;
    });

    navigator.clipboard.writeText(textToCopy).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.innerText = '✓ 복사 완료!';
      setTimeout(() => {
        btn.innerText = '📋 전체 답변 복사하기';
      }, 2000);
    }).catch(err => {
      alert('복사에 실패했습니다. 수동으로 텍스트를 드래그하여 복사해 주세요.');
    });
  }

  function toggleCounselorModal() {
    const modal = document.getElementById('counselor-modal');
    modal.classList.toggle('active');
  }

  function resetQuiz() {
    showScreen('start-screen');
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }
</script>
